[project]
name = "geo-engine"
version = "0.1.0"
description = "Goea Engine: inteligencia comercial y generación GEO con evidencia"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geo_engine*"]
