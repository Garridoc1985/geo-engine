name: Verificar acceso público de Vector Bikes
on:
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
jobs:
  public-access:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar acceso sin sesión y rastreo
        run: node scripts/check-public-site.mjs https://vectorbikestest.cl
